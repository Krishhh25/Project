<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pune Bus Feedback System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <i class="fas fa-bus-alt fa-2x"></i>
            <h1>Pune Bus Service Feedback</h1>
        </div>
        <p>Community Service Project - Pune City</p>
    </header>

    <main class="main-container">
        <section class="form-section card">
            <h2><i class="fas fa-pen-fancy"></i> New Feedback</h2>
            <form id="form">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="number" id="age" placeholder="Age" required>
                <input type="text" id="route" placeholder="Route No. (e.g. 24A)">
                <textarea id="feedback" placeholder="Your experience..." required></textarea>
                <button type="submit" id="submitBtn">Submit <i class="fas fa-paper-plane"></i></button>
            </form>
        </section>

        <section class="table-section card">
            <h2><i class="fas fa-history"></i> Live Logs</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Route</th>
                            <th>Feedback</th>
                        </tr>
                    </thead>
                    <tbody id="tableData"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
