<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pune Bus Feedback System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <i class="fas fa-bus-alt fa-2x"></i>
            <h1>Pune Bus Service Feedback</h1>
        </div>
        <p>Your voice helps shape a better commute for everyone.</p>
    </header>

    <main class="main-container">
        
        <section class="form-section card">
            <h2><i class="fas fa-pen-fancy"></i> Submit New Feedback</h2>
            <form id="form">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="name" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-calendar-alt input-icon"></i>
                    <input type="number" id="age" placeholder="Age" min="1" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-route input-icon"></i>
                    <input type="text" id="route" placeholder="Route No. (e.g., 101, 42)">
                </div>

                <div class="input-group">
                    <i class="fas fa-comment-dots textarea-icon"></i>
                    <textarea id="feedback" placeholder="Share your experience or suggestions..." rows="5" required></textarea>
                </div>

                <button type="submit" id="submitBtn">
                    Submit Feedback <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </section>

        <section class="table-section card">
            <h2><i class="fas fa-history"></i> Recent Feedback Logs</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-user"></i> Name</th>
                            <th><i class="fas fa-calendar-alt"></i> Age</th>
                            <th><i class="fas fa-route"></i> Route</th>
                            <th><i class="fas fa-comment-dots"></i> Feedback</th>
                        </tr>
                    </thead>
                    <tbody id="tableData">
                        </tbody>
                </table>
            </div>
        </section>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
